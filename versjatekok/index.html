const games={

 flowers:{title:'Sárga virágok',name:'Szedjünk virágcsokrot!',hint:'Keresd meg a három sárga virágot!',icon:'flower',tint:'#f3e8c6',steps:3,win:'Csodaszép a virágcsokrod!',note:'Mind a három sárga virágot megtaláltad.'},

const slugs={labda:'ball',libaleptek:'geese','sarga-viragok':'flowers',hangyaboly:'ants','telapo-kabatja':'santa'};
const $=id=>document.getElementById(id);
const svg=(name,cls='')=>'<svg class="'+cls+'" viewBox="0 0 200 200" aria-hidden="true"><use href="#'+name+'"/></svg>';
let current=null,count=0,selected=null,round=0,busy=false,started=false,prompt='menu',generation=0,timer=null;
const audio=new Audio();audio.preload='auto';let voiceRequest=0;
function speak(key){prompt=key;const token=++voiceRequest;audio.pause();audio.src=AUDIO[key];const p=audio.play();if(p)p.then(()=>{if(token===voiceRequest)$('audioNotice').classList.add('hidden');}).catch(e=>{if(token===voiceRequest&&e.name!=='AbortError')$('audioNotice').classList.remove('hidden');});}
function stop(){clearTimeout(timer);generation++;voiceRequest++;busy=false;audio.pause();$('confetti').replaceChildren();$('audioNotice').classList.add('hidden');}
function later(fn,ms){const token=generation;timer=setTimeout(()=>{if(token===generation)fn();},ms);}
function progress(){const total=games[current].steps;$('progress').innerHTML=Array.from({length:total},(_,i)=>'<i class="'+(i<count?'on':'')+'"></i>').join('');$('progress').setAttribute('aria-label',count+' sikerült lépés'+' a '+total+' közül');}
function menu(){stop();current=null;started=false;history.replaceState(null,'',location.pathname);$('menu').classList.remove('hidden');$('game').classList.add('hidden');$('homeButton').classList.add('hidden');document.title='Játssz a versekkel! · Gyermeki szemmel';speak('menu');window.scrollTo(0,0);}
function launch(id,gesture=false){stop();current=id;count=0;selected=null;round=0;started=false;$('menu').classList.add('hidden');$('game').classList.remove('hidden');$('homeButton').classList.remove('hidden');$('success').classList.add('hidden');$('status').textContent='';$('board').classList.toggle('snow',id==='santa');$('board').dataset.game=id;const g=games[id];$('poemLabel').textContent=g.title;$('gameTitle').textContent=g.name;$('instruction').textContent=g.hint;document.title=g.title+' · Játssz a verssel!';history.replaceState(null,'',location.pathname+'#'+Object.keys(slugs).find(s=>slugs[s]===id));progress();draw();$('start').classList.remove('hidden');$('activity').inert=true;window.scrollTo(0,0);if(gesture)begin();}
function begin(){started=true;$('start').classList.add('hidden');$('activity').inert=false;speak(current);}
function celebration(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=$('confetti');c.replaceChildren();for(let i=0;i<28;i++){const n=document.createElement('i');n.style.left=Math.random()*100+'%';n.style.background=['#edc363','#87b69b','#d89578','#a7b6ce'][i%4];n.style.animationDelay=Math.random()*.4+'s';c.appendChild(n);}later(()=>c.replaceChildren(),3300);}
function win(){busy=false;count=games[current].steps;progress();$('success').classList.remove('hidden');$('successTitle').textContent=games[current].win;$('successText').textContent=games[current].note;$('status').textContent='Sikerült!';speak(current+'-win');celebration();}
function shuffled(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function draw(){
 if(current==='ball'){$('activity').innerHTML='<div class="groundline"></div><div class="ballstars" aria-hidden="true">'+Array.from({length:5},()=>'<span>'+svg('star')+'</span>').join('')+'</div><div class="ballshadow"></div><button id="ballButton" class="ball" aria-label="Pattintsd fel a labdát">'+svg('ball')+'</button>';return;}
 if(current==='geese'){const pts=[[26,73],[43,53],[60,74],[77,40]];$('activity').innerHTML='<div class="pond"></div><svg class="route" viewBox="0 0 800 400" preserveAspectRatio="none" aria-hidden="true"><path d="M100 335 208 292 344 212 480 296 616 160" fill="none" stroke="#e9e0ae" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/></svg>'+pts.map(([x,y],i)=>'<button class="footprint'+(i===0?' active':'')+'" data-step="'+i+'" style="left:'+x+'%;top:'+y+'%" '+(i===0?'':'disabled')+' aria-label="'+(i+1)+'. lábnyom">'+svg('foot')+'</button>').join('')+'<div class="family" style="left:14%;top:86%" aria-hidden="true">'+svg('goose','parent')+svg('goose','baby')+svg('goose','baby last')+'</div>';return;}
 if(current==='flowers'){const colors=shuffled(['#edc75b','#edc75b','#edc75b','#deb3bd','#deb3bd','#ae9fc2']);$('activity').innerHTML='<div class="flowergrid">'+colors.map((c,i)=>'<button class="flower" data-flower="'+i+'" data-yellow="'+(c==='#edc75b')+'" style="--petal:'+c+'" aria-label="'+(c==='#edc75b'?'Sárga':c==='#deb3bd'?'Rózsaszín':'Lila')+' virág '+(i+1)+'">'+svg('flower')+'</button>').join('')+'</div>';return;}
 if(current==='ants'){$('activity').innerHTML='<div class="anttrail"></div><button id="mound" class="mound" aria-label="A hangyaboly bejárata">'+svg('anthill')+'</button>'+[0,1,2].map(i=>'<button class="antbutton" data-ant="'+i+'" aria-label="'+(i+1)+'. hangya" style="left:'+([17,50,83][i])+'%">'+svg('ant')+'</button>').join('');return;}
 drawSanta();

function drawSanta(){if(round===0){$('activity').innerHTML='<div class="choices">'+shuffled([['#c86b57','Piros kabát','red'],['#7ba6bd','Kék kabát','blue'],['#96b780','Zöld kabát','green']]).map(([c,name,key])=>'<button class="choice" data-coat="'+key+'" style="--coat:'+c+'" aria-label="'+name+'">'+svg('coat')+'</button>').join('')+'</div>';}else{$('gameTitle').textContent='Segít a bölcs bagoly';$('instruction').textContent='Keresd meg a nagy szemű baglyot!';$('activity').innerHTML='<div class="choices">'+shuffled([['owl','Bagoly'],['fox','Róka'],['rabbit','Nyúl']]).map(([k,n])=>'<button class="choice" data-animal="'+k+'" aria-label="'+n+'">'+svg(k)+'</button>').join('')+'</div>';}}
$('activity').onclick=e=>{
 if(!started||busy||count===games[current].steps)return;
 if(current==='ball'&&e.target.closest('#ballButton')){busy=true;const b=$('ballButton');count++;progress();b.style.setProperty('--jump',(-50-count*21)+'px');b.classList.add('jumping');b.disabled=true;const star=document.querySelectorAll('.ballstars span')[count-1];star.classList.add('on','star-burst');later(()=>{b.classList.remove('jumping');b.disabled=false;busy=false;if(count===5)win();else speak('ball-more');},750);return;}
 if(current==='geese'){const step=e.target.closest('[data-step]');if(!step||Number(step.dataset.step)!==count)return;step.disabled=true;step.classList.remove('active');step.classList.add('passed');count++;progress();const positions=[[26,73],[43,53],[60,74],[81,28]],pos=positions[count-1],family=document.querySelector('.family');family.style.left=pos[0]+'%';family.style.top=pos[1]+'%';if(count===4){family.classList.add('swimming');win();}else{const next=document.querySelector('[data-step="'+count+'"]');next.disabled=false;next.classList.add('active');speak('geese-more');}return;}
 if(current==='flowers'){const f=e.target.closest('[data-flower]');if(!f||f.disabled)return;if(f.dataset.yellow!=='true'){f.classList.remove('reassure');void f.offsetWidth;f.classList.add('reassure');speak('flowers-other');return;}f.disabled=true;f.classList.add('picked');count++;progress();if(count===3){win();const bouquet=document.createElement('div');bouquet.className='finish-bouquet';bouquet.setAttribute('aria-label','Három sárga virág a csokrodban');bouquet.innerHTML=svg('flower')+svg('flower')+svg('flower');$('activity').appendChild(bouquet);}else speak('flowers-more');return;}
 if(current==='ants'){const ant=e.target.closest('[data-ant]');if(ant&&!ant.disabled){selected=Number(ant.dataset.ant);document.querySelectorAll('[data-ant]').forEach(b=>b.classList.toggle('selected',b===ant));$('mound').classList.add('waiting');speak('ants-place');return;}if(e.target.closest('#mound')){if(selected===null){speak('ants-choose');return;}const b=document.querySelector('[data-ant="'+selected+'"]');b.classList.add('home');b.classList.remove('selected');b.disabled=true;selected=null;$('mound').classList.remove('waiting');count++;progress();if(count===3)win();else speak('ants-more');}return;}
 if(current==='santa'){const choice=e.target.closest('.choice');if(!choice)return;const correct=round===0?choice.dataset.coat==='red':choice.dataset.animal==='owl';if(!correct){choice.classList.remove('reassure');void choice.offsetWidth;choice.classList.add('reassure');speak(round===0?'santa-other':'santa-hint');return;}choice.classList.add('correct');count++;progress();if(round===0){round=1;busy=true;later(()=>{busy=false;drawSanta();speak('santa-owl');},650);}else{$('activity').innerHTML='<div class="santa-final">'+svg('santa')+'<div class="small-owl">'+svg('owl')+'</div></div>';win();}return;}
};
$('startButton').onclick=begin;$('audioNotice').onclick=()=>speak(prompt);
$('soundButton').onclick=()=>{if(current&&!started)begin();else speak(current?(current==='santa'&&round===1&&count!==2?'santa-owl':count===games[current].steps?current+'-win':current):'menu');};
$('homeButton').onclick=menu;$('menuButton').onclick=menu;$('againButton').onclick=()=>launch(current,true);
for(const [id,g] of Object.entries(games)){const b=document.createElement('button');b.className='card';b.innerHTML='<span class="picture" style="--tint:'+g.tint+'">'+svg(g.icon)+'</span><h3>'+g.title+'</h3><small>'+({ball:'Pattints egy nagyot!',geese:'Kísérd őket a tóhoz!',flowers:'Sárga csokor készül',ants:'Segíts nekik hazajutni!',santa:'Keresd meg a kabátot!'})[id]+'</small>';b.onclick=()=>launch(id,true);$('cards').appendChild(b);}
const duck=document.createElement('a');duck.className='card';duck.href='../kiskacsa/';duck.innerHTML='<span class="picture" style="--tint:#e3ebd4">'+svg('duckhouse')+'</span><h3>A kiskacsa háza</h3><small>Kirakó és színező</small>';$('cards').appendChild(duck);
function route(){const id=slugs[location.hash.slice(1)];if(id)launch(id);else{current=null;$('menu').classList.remove('hidden');$('game').classList.add('hidden');$('homeButton').classList.add('hidden');}}
window.addEventListener('hashchange',()=>{stop();route();});route();
</script></body></html>
